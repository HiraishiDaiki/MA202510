<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Timpani Visualizer</title>
    <link rel="stylesheet" href="style_mic.css">
</head>
<body>
    <header>
        <button id="menuButton" class="menu-button">☰</button>
    </header>

    <nav id="slideInMenu" class="slide-in-menu">
        <ul>
            <li><a href="../index.html">Topへ</a></li>
            <li><a href="../balance/index.html">バランス表示へ</a></li>
            <li><a href="../decay/index.html">減衰曲線表示へ</a></li>
        </ul>
    </nav>

    <div class="wrapper">
        
        <div class="left-panel">
            <canvas id="canvas" width="600" height="600"></canvas>
            <button class="saveBtn" data-canvas-id="canvas">Save Canvas</button>
        </div>

        <div class="right-panel">
            
            <div class="controls box">
                <div class="device-select-group">
                    <label for="audioSource">入力デバイス:</label>
                    <select id="audioSource"></select>
                </div>
                <button id="startBtn">マイク入力を開始</button>
                <div id="status">開始ボタンを押してください</div>
            </div>

            <div class="box">
                <label for="delayInput">L/R 遅延補正 (位相合わせ): <span id="delayValue">0.0</span> ms</label>
                <input type="range" id="delayInput" min="-5" max="5" step="0.1" value="0">
            </div>

            <div class="box">
                <label>減衰曲線 (L² + R²)</label>
                <canvas id="ampCanvas" width="600" height="200"></canvas>
                <button class="saveBtn" data-canvas-id="ampCanvas">減衰曲線を保存</button>
            </div>

            <div class="box">
                <details class="accordion" open>
                    <summary>周波数スペクトル (L / R)</summary>
                    <label>frequencyL</label>
                    <canvas id="frequencyCanvasL" width="600" height="200"></canvas>
                    <label>frequencyR</label>
                    <canvas id="frequencyCanvasR" width="600" height="200"></canvas>
                    <button class="saveBtn" data-canvas-id="frequencyCanvasL">Lを保存</button>
                    <button class="saveBtn" data-canvas-id="frequencyCanvasR">Rを保存</button>
                </details>
            </div>

            <div class="settings-panel box">
                <div class="control-group">
                    <label for="freqInput">中心周波数 (Hz)</label>
                    <input type="number" id="freqInput" min="20" max="1000" value="135" step="1">
                </div>
                <div class="control-group">
                    <label for="bwInput">バンド幅 (Hz)</label>
                    <input type="number" id="bwInput" min="1" max="100" value="5" step="1">
                </div>
                <div class="control-group">
                    <label for="gainInput">表示ゲイン (Zoom)</label>
                    <input type="number" id="gainInput" min="1.0" max="100.0" value="5.0" step="0.5">
                </div>
            </div>

        </div> </div> <script src="script_mic.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
